<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Bull Beast 3D Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #FF0000;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .scene-name {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            background: #FF0000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        button:hover {
            background: #CC0000;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.5);
        }

        .instruction {
            position: absolute;
            bottom: 80px;
            width: 100%;
            text-align: center;
            color: #FFF;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">🎬 RED BULL 3D BEAST</div>
    <div class="scene-name" id="sceneName">Scene 1: Cycling on Rails</div>
    <div class="instruction">Use Arrow Keys ⬅️ ➡️ to switch scenes | Auto-plays every 5 seconds</div>
    
    <div class="controls">
        <button onclick="prevScene()">⬅️ Previous</button>
        <button onclick="nextScene()">Next ➡️</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let currentScene = 0;
        const sceneNames = [
            "🚴 Scene 1: Cycling Beast on Rails",
            "🛹 Scene 2: Skate Jump from Heights",
            "🍻 Scene 3: Red Bull Victory"
        ];

        let scene, camera, renderer;
        let objects = [];

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 100, 500);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 30, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            scene.add(directionalLight);

            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const skyGeometry = new THREE.SphereGeometry(400, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({
                color: 0x87CEEB,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            createScene1();
            createScene2();
            createScene3();

            window.addEventListener('resize', onWindowResize, false);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') nextScene();
                if (e.key === 'ArrowLeft') prevScene();
            });

            setInterval(() => {
                nextScene();
            }, 5000);

            animate();
        }

        function createScene1() {
            const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7 });
            
            const leftRailGeom = new THREE.BoxGeometry(0.3, 0.3, 60);
            const leftRail = new THREE.Mesh(leftRailGeom, trackMaterial);
            leftRail.position.set(-3, 0.5, 0);
            leftRail.castShadow = true;
            leftRail.receiveShadow = true;
            scene.add(leftRail);

            const rightRail = leftRail.clone();
            rightRail.position.x = 3;
            scene.add(rightRail);

            for (let i = -30; i < 30; i += 2) {
                const tieGeom = new THREE.BoxGeometry(6.5, 0.2, 0.4);
                const tie = new THREE.Mesh(tieGeom, trackMaterial);
                tie.position.set(0, 0.4, i);
                tie.castShadow = true;
                tie.receiveShadow = true;
                scene.add(tie);
            }

            const cyclist = createStickCyclist();
            cyclist.position.set(-15, 1, 20);
            scene.add(cyclist);

            cyclist.userData.targetX = 20;
            cyclist.userData.speed = 0.08;
            cyclist.userData.animate = function() {
                if (this.position.x < this.userData.targetX) {
                    this.position.x += this.userData.speed;
                    this.rotation.y = -0.2;
                } else {
                    this.position.x = -15;
                }
                const wheelL = this.getObjectByName('wheelLeft');
                const wheelR = this.getObjectByName('wheelRight');
                if (wheelL) wheelL.rotation.z -= 0.3;
                if (wheelR) wheelR.rotation.z -= 0.3;
            };
            objects.push(cyclist);
        }

        function createStickCyclist() {
            const group = new THREE.Group();

            const headGeom = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xFDB4B4 });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 2;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            const bodyGeom = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF0000 });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const armGeom = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xFDB4B4 });
            const leftArm = new THREE.Mesh(armGeom, armMat);
            leftArm.rotation.z = Math.PI / 4;
            leftArm.position.set(-0.7, 1.5, 0);
            leftArm.castShadow = true;
            leftArm.receiveShadow = true;
            group.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.7;
            group.add(rightArm);

            const legGeom = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const leftLeg = new THREE.Mesh(legGeom, legMat);
            leftLeg.position.set(-0.4, 0.5, 0);
            leftLeg.castShadow = true;
            leftLeg.receiveShadow = true;
            group.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.4;
            group.add(rightLeg);

            const wheelGeom = new THREE.TorusGeometry(0.8, 0.1, 16, 32);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8 });
            const wheelLeft = new THREE.Mesh(wheelGeom, wheelMat);
            wheelLeft.rotation.y = Math.PI / 2;
            wheelLeft.position.set(-1.2, 0, 0);
            wheelLeft.castShadow = true;
            wheelLeft.receiveShadow = true;
            wheelLeft.name = 'wheelLeft';
            group.add(wheelLeft);

            const wheelRight = wheelLeft.clone();
            wheelRight.position.x = 1.2;
            wheelRight.name = 'wheelRight';
            group.add(wheelRight);

            const frameGeom = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 8);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xFF6600 });
            const frame = new THREE.Mesh(frameGeom, frameMat);
            frame.position.y = 0.5;
            frame.castShadow = true;
            group.add(frame);

            return group;
        }

        function createScene2() {
            const buildingGeom = new THREE.BoxGeometry(10, 15, 10);
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const building = new THREE.Mesh(buildingGeom, buildingMat);
            building.position.set(15, 7.5, 0);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            const roofGeom = new THREE.ConeGeometry(8, 4, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x654321 });
            const roof = new THREE.Mesh(roofGeom, roofMat);
            roof.position.set(15, 18, 0);
            roof.castShadow = true;
            roof.receiveShadow = true;
            scene.add(roof);

            const skater = createStickSkater();
            skater.position.set(12, 20, 0);
            scene.add(skater);

            skater.userData.time = 0;
            skater.userData.animate = function() {
                this.userData.time += 0.01;
                const t = this.userData.time % 3;
                
                if (t < 1.5) {
                    this.position.y = 20 - Math.sin(t * Math.PI / 1.5) * 10;
                    this.position.x = 12 - t * 3;
                    this.rotation.z = -t * 0.5;
                } else {
                    this.userData.time = 0;
                }
            };
            objects.push(skater);
        }

        function createStickSkater() {
            const group = new THREE.Group();

            const headGeom = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xFDB4B4 });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            const bodyGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF0000 });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const armGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.9, 8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xFDB4B4 });
            const leftArm = new THREE.Mesh(armGeom, armMat);
            leftArm.rotation.z = Math.PI / 3;
            leftArm.position.set(-0.6, 1.3, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.6;
            group.add(rightArm);

            const legGeom = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const leftLeg = new THREE.Mesh(legGeom, legMat);
            leftLeg.position.set(-0.3, 0.3, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.3;
            group.add(rightLeg);

            const boardGeom = new THREE.BoxGeometry(1.5, 0.15, 0.5);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0xFF6B00 });
            const board = new THREE.Mesh(boardGeom, boardMat);
            board.position.set(0, -0.2, 0);
            board.castShadow = true;
            board.receiveShadow = true;
            group.add(board);

            const wheelGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const w1 = new THREE.Mesh(wheelGeom, wheelMat);
            w1.rotation.z = Math.PI / 2;
            w1.position.set(-0.5, -0.4, 0);
            group.add(w1);

            const w2 = w1.clone();
            w2.position.x = 0.5;
            group.add(w2);

            return group;
        }

        function createScene3() {
            const tableTopGeom = new THREE.BoxGeometry(8, 0.3, 6);
            const tableTopMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const tableTop = new THREE.Mesh(tableTopGeom, tableTopMat);
            tableTop.position.y = 1;
            tableTop.castShadow = true;
            tableTop.receiveShadow = true;
            scene.add(tableTop);

            for (let x of [-3.5, 3.5]) {
                for (let z of [-2.5, 2.5]) {
                    const legGeom = new THREE.BoxGeometry(0.3, 1, 0.3);
                    const leg = new THREE.Mesh(legGeom, tableTopMat);
                    leg.position.set(x, 0.5, z);
                    leg.castShadow = true;
                    leg.receiveShadow = true;
                    scene.add(leg);
                }
            }

            const bottle = createRedBullBottle();
            bottle.position.set(0, 1.5, 0);
            scene.add(bottle);

            bottle.userData.animate = function() {
                const time = Date.now() * 0.003;
                this.scale.y = 1 + Math.sin(time) * 0.1;
                this.getObjectByName('glow').intensity = 1 + Math.sin(time) * 0.5;
            };
            objects.push(bottle);
        }

        function createRedBullBottle() {
            const group = new THREE.Group();

            const capGeom = new THREE.ConeGeometry(0.4, 0.4, 16);
            const capMat = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.8 });
            const cap = new THREE.Mesh(capGeom, capMat);
            cap.position.y = 3;
            cap.castShadow = true;
            cap.receiveShadow = true;
            group.add(cap);

            const neckGeom = new THREE.CylinderGeometry(0.35, 0.5, 0.8, 16);
            const neckMat = new THREE.MeshStandardMaterial({ color: 0x0047AB, metalness: 0.6 });
            const neck = new THREE.Mesh(neckGeom, neckMat);
            neck.position.y = 2.3;
            neck.castShadow = true;
            neck.receiveShadow = true;
            group.add(neck);

            const bodyGeom = new THREE.CylinderGeometry(1, 0.8, 2.5, 32);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1E90FF,
                metalness: 0.4,
                roughness: 0.3
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const shineGeom = new THREE.CylinderGeometry(0.25, 0.2, 2, 8);
            const shineMat = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF,
                emissive: 0x4488FF,
                emissiveIntensity: 0.5
            });
            const shine = new THREE.Mesh(shineGeom, shineMat);
            shine.position.set(-0.3, 0.8, 0);
            shine.name = 'glow';
            group.add(shine);

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFD700';
            ctx.font = 'Bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('RED', 128, 100);
            ctx.fillText('BULL', 128, 150);
            ctx.fillText('🐂', 128, 200);

            const texture = new THREE.CanvasTexture(canvas);
            const logoGeom = new THREE.CylinderGeometry(1, 0.8, 1.5, 32);
            const logoMat = new THREE.MeshStandardMaterial({ map: texture });
            const logo = new THREE.Mesh(logoGeom, logoMat);
            logo.position.y = 0.8;
            logo.position.z = 0.82;
            group.add(logo);

            const light = new THREE.PointLight(0xFFD700, 2, 15);
            light.position.set(0, 2, 0);
            light.castShadow = false;
            group.add(light);

            return group;
        }

        function nextScene() {
            currentScene = (currentScene + 1) % 3;
            updateScene();
        }

        function prevScene() {
            currentScene = (currentScene - 1 + 3) % 3;
            updateScene();
        }

        function updateScene() {
            document.getElementById('sceneName').textContent = sceneNames[currentScene];
            
            const toRemove = [];
            scene.children.forEach(obj => {
                if (obj !== scene.children[0] && obj !== scene.children[1] && 
                    obj !== scene.children[2] && obj !== scene.children[3]) {
                    if (obj.userData.animate) {
                        toRemove.push(obj);
                    }
                }
            });
            toRemove.forEach(obj => scene.remove(obj));
            objects = [];

            if (currentScene === 0) createScene1();
            else if (currentScene === 1) createScene2();
            else if (currentScene === 2) createScene3();
        }

        function animate() {
            requestAnimationFrame(animate);

            objects.forEach(obj => {
                if (obj.userData.animate) {
                    obj.userData.animate();
                }
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
